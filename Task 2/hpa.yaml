apiVersion: autoscaling/v2      
kind: HorizontalPodAutoscaler       
metadata:
  name: scaletestapp-hpa                         
spec:
  scaleTargetRef:
    apiVersion: apps/v1           # Ссылка на Deployment, использующий версию API apps/v1
    kind: Deployment              # Масштабируется именно Deployment (не ReplicaSet, не StatefulSet)
    name: scaletestapp            # Имя Deployment, который нужно масштабировать
  minReplicas: 1                  # Минимальное количество реплик
  maxReplicas: 10                 # Максимальное количество реплик
  metrics:
    - type: Resource              # Тип метрики. Resource (CPU, Memory).
      resource:
        name: memory            
        target:
          type: Utilization       # Целевой показатель, % загрузки ресурса (от Requests).
          averageUtilization: 80  # Граница срабатывания масштабирования
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80