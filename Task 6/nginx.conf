http {
    # Общие настройки лимитирования
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/m;
    
    # Настройка upstream для балансировки нагрузки
    upstream backend_servers {
        server backend1.example.com;
        server backend2.example.com;
        server backend3.example.com;
        keepalive 32;  # Оптимизация keepalive соединений
    }

    server {
        listen 80;
        server_name api.example.com;

        # Глобальные заголовки безопасности
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        location / {
            # Rate limiting с burst и nodelay
            limit_req zone=api_limit burst=5 nodelay;
            limit_req_status 429;
            
            # Информационные заголовки о лимитах
            add_header X-RateLimit-Limit "10" always;
            add_header X-RateLimit-Remaining "$remaining" always;
            add_header X-RateLimit-Reset "60" always;
            add_header Retry-After "60" always;
            
            # Проксирование
            proxy_pass http://backend_servers;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Обработка ошибок
            proxy_intercept_errors on;
            error_page 429 = @rate_limit_exceeded;
        }

        # Кастомная обработка 429 ошибки
        location @rate_limit_exceeded {
            default_type application/json;
            return 429 '{"error": "Too Many Requests", "message": "Rate limit exceeded - 10 requests per minute allowed", "retry_after": 60}';
        }

        # Health check endpoint без лимитов
        location /health {
            access_log off;
            proxy_pass http://backend_servers;
        }
    }
}